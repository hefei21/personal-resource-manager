name: Backend tests

on:
  push:
    branches:
      - "codex/**"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install locked dependencies
        run: npm ci

      - name: Run backend tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          status=${PIPESTATUS[0]}
          if [[ "$status" -ne 0 ]]; then
            grep -n -m 8 -B 2 -A 32 '^not ok ' test-output.log > test-failures.txt || \
              tail -n 80 test-output.log > test-failures.txt
            head -c 3500 test-failures.txt | sed 's/%/%25/g; s/\r/%0D/g' > test-failures-escaped.txt
            message=$(awk 'BEGIN { ORS="%0A" } { print }' test-failures-escaped.txt)
            echo "::error title=Backend test failure::$message"
          fi
          exit "$status"
