services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pr-test-backend
    restart: "no"
    ports:
      - "127.0.0.1:13000:3000"
    volumes:
      - ./.codex/test-runtime/data/db:/app/data/database
      - ./.codex/test-runtime/data/documents:/app/data/documents
      - ./.codex/test-runtime/data/music:/app/data/music
      - ./.codex/test-runtime/data/books:/app/data/books
      - ./.codex/test-runtime/data/code:/app/data/code
      - ./.codex/test-runtime/data/uploads:/app/data/uploads
      - ./.codex/test-runtime/data/logs:/app/data/logs
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_PATH: /app/data
      DB_PATH: /app/data/database/app.db
      DOCUMENTS_PATH: /app/data/documents
      MUSIC_PATH: /app/data/music
      BOOKS_PATH: /app/data/books
      CODE_PATH: /app/data/code
      UPLOADS_PATH: /app/data/uploads
      LOGS_PATH: /app/data/logs
      DEFAULT_USERNAME: ${TEST_ADMIN_USERNAME}
      DEFAULT_PASSWORD: ${TEST_ADMIN_PASSWORD}
      CORS_ORIGIN: http://localhost:15173
      REDIS_URL: redis://redis:6379
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: localhost,127.0.0.1,redis,backend
      BANGUMI_ACCESS_TOKEN: ""
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pr-test-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>r.json()).then(h=>{if(h?.services?.database!=='ok')process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: pr-test-redis
    restart: "no"
    volumes:
      - ./.codex/test-runtime/data/redis:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
    networks:
      - pr-test-network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pr-test-frontend
    restart: "no"
    ports:
      - "127.0.0.1:15173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pr-test-network
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1/ || exit 1"
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  pr-test-network:
    name: pr-test-network
    driver: bridge
