services:
  backend:
    image: ghcr.io/hefei21/personal-resource-manager-backend:${IMAGE_TAG}
    container_name: pr-manager-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ${DATA_ROOT}/db:/app/data/database
      - ${DATA_ROOT}/docs:/app/data/documents
      - ${DATA_ROOT}/storage:/app/data/storage
      - ${DATA_ROOT}/music:/app/data/music
      - ${DATA_ROOT}/books:/app/data/books
      - ${DATA_ROOT}/code:/app/data/code
      - ${DATA_ROOT}/uploads:/app/data/uploads
      - ${DATA_ROOT}/logs:/app/data/logs
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_PATH: /app/data
      DB_PATH: /app/data/database/app.db
      DOCUMENTS_PATH: /app/data/documents
      STORAGE_PATH: /app/data/storage
      MUSIC_PATH: /app/data/music
      BOOKS_PATH: /app/data/books
      CODE_PATH: /app/data/code
      UPLOADS_PATH: /app/data/uploads
      LOGS_PATH: /app/data/logs
      DEFAULT_USERNAME: ${DEFAULT_USERNAME:-admin}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:?DEFAULT_PASSWORD is required for first install}
      CORS_ORIGIN: ${CORS_ORIGIN}
      BANGUMI_ACCESS_TOKEN: ${BANGUMI_ACCESS_TOKEN:-}
      REDIS_URL: redis://redis:6379
      # Vector search is an optional derived layer. Keep it disabled unless a
      # complete embedding identity is supplied and the rag-vector profile is started.
      RAG_VECTOR_ENABLED: ${RAG_VECTOR_ENABLED:-false}
      RAG_VECTOR_BASE_URL: ${RAG_VECTOR_BASE_URL:-http://qdrant:6333}
      RAG_VECTOR_COLLECTION: ${RAG_VECTOR_COLLECTION:-rag_vectors}
      RAG_VECTOR_TIMEOUT_MS: ${RAG_VECTOR_TIMEOUT_MS:-5000}
      RAG_VECTOR_EMBEDDING_PROVIDER: ${RAG_VECTOR_EMBEDDING_PROVIDER:-}
      RAG_VECTOR_EMBEDDING_MODEL_ID: ${RAG_VECTOR_EMBEDDING_MODEL_ID:-}
      RAG_VECTOR_EMBEDDING_MODEL_REVISION: ${RAG_VECTOR_EMBEDDING_MODEL_REVISION:-}
      RAG_VECTOR_EMBEDDING_DIMENSIONS: ${RAG_VECTOR_EMBEDDING_DIMENSIONS:-}
      RAG_VECTOR_EMBEDDING_INPUT_LIMIT: ${RAG_VECTOR_EMBEDDING_INPUT_LIMIT:-}
      RAG_VECTOR_EMBEDDING_DISTANCE: ${RAG_VECTOR_EMBEDDING_DISTANCE:-}
      RAG_VECTOR_EMBEDDING_NORMALIZATION: ${RAG_VECTOR_EMBEDDING_NORMALIZATION:-}
      RAG_VECTOR_EMBEDDING_CONFIG_HASH: ${RAG_VECTOR_EMBEDDING_CONFIG_HASH:-}
      RAG_RERANKER_ENABLED: ${RAG_RERANKER_ENABLED:-false}
      RAG_RERANKER_PROVIDER: ${RAG_RERANKER_PROVIDER:-}
      RAG_RERANKER_MODEL_ID: ${RAG_RERANKER_MODEL_ID:-}
      RAG_RERANKER_MODEL_REVISION: ${RAG_RERANKER_MODEL_REVISION:-}
      RAG_RERANKER_DIMENSIONS: ${RAG_RERANKER_DIMENSIONS:-}
      RAG_RERANKER_INPUT_LIMIT: ${RAG_RERANKER_INPUT_LIMIT:-}
      RAG_RERANKER_CONFIG_HASH: ${RAG_RERANKER_CONFIG_HASH:-}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      ALL_PROXY: ${ALL_PROXY:-}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,redis,backend,qdrant}
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pr-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: pr-manager-redis
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT}/redis:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
    networks:
      - pr-network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20

  # Optional, rebuildable vector index. The profile prevents an ordinary NAS
  # start from creating or depending on Qdrant. The digest was verified during
  # the Stage 6C isolated preflight; storage must remain on local POSIX storage.
  qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    profiles:
      - rag-vector
    restart: unless-stopped
    volumes:
      - ${RAG_VECTOR_DATA_ROOT:-${DATA_ROOT}/qdrant}/storage:/qdrant/storage
      - ${RAG_VECTOR_DATA_ROOT:-${DATA_ROOT}/qdrant}/snapshots:/qdrant/snapshots
    networks:
      - pr-network
    healthcheck:
      # The slim image intentionally has no curl/wget; verify its HTTP port is
      # listening without adding a package or a mutable sidecar.
      test:
        - CMD-SHELL
        - "grep -q ':18BD ' /proc/net/tcp || exit 1"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    image: ghcr.io/hefei21/personal-resource-manager-frontend:${IMAGE_TAG}
    container_name: pr-manager-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pr-network

networks:
  pr-network:
    name: pr-network
    driver: bridge
