services:
  backup-restore-test:
    image: ${BACKUP_RESTORE_TEST_IMAGE:?Set an immutable backend image tag}
    restart: "no"
    command:
      - node
      - --test
      - test/backup-set-integration.test.js
    environment:
      NODE_ENV: test
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
