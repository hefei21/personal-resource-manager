services:
  stage6-backend:
    image: ghcr.io/hefei21/personal-resource-manager-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: pr-manager-stage6-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:?BACKEND_PORT is required}:3000"
    volumes:
      - ${DATA_ROOT:?DATA_ROOT is required}/db:/app/data/database
      - ${DATA_ROOT:?DATA_ROOT is required}/docs:/app/data/documents
      - ${DATA_ROOT:?DATA_ROOT is required}/storage:/app/data/storage
      - ${DATA_ROOT:?DATA_ROOT is required}/music:/app/data/music
      - ${DATA_ROOT:?DATA_ROOT is required}/books:/app/data/books
      - ${DATA_ROOT:?DATA_ROOT is required}/code:/app/data/code
      - ${DATA_ROOT:?DATA_ROOT is required}/uploads:/app/data/uploads
      - ${DATA_ROOT:?DATA_ROOT is required}/logs:/app/data/logs
      - ${SCAN_ROOT:?SCAN_ROOT is required}:/app/data/stage6-nas:ro
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_PATH: /app/data
      DB_PATH: /app/data/database/app.db
      DOCUMENTS_PATH: /app/data/documents
      STORAGE_PATH: /app/data/storage
      RAG_ARTIFACT_ROOT: /app/data/storage/rag-artifacts
      MUSIC_PATH: /app/data/music
      BOOKS_PATH: /app/data/books
      CODE_PATH: /app/data/code
      UPLOADS_PATH: /app/data/uploads
      LOGS_PATH: /app/data/logs
      DEFAULT_USERNAME: ${DEFAULT_USERNAME:?DEFAULT_USERNAME is required}
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:?DEFAULT_PASSWORD is required}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      BANGUMI_ACCESS_TOKEN: ${BANGUMI_ACCESS_TOKEN:-}
      REDIS_URL: redis://stage6-redis:6379
      RAG_VECTOR_ENABLED: ${RAG_VECTOR_ENABLED:-false}
      RAG_VECTOR_BASE_URL: ${RAG_VECTOR_BASE_URL:-http://stage6-qdrant:6333}
      RAG_VECTOR_COLLECTION: ${RAG_VECTOR_COLLECTION:-rag_vectors_stage6c}
      RAG_VECTOR_TIMEOUT_MS: ${RAG_VECTOR_TIMEOUT_MS:-5000}
      RAG_VECTOR_EMBEDDING_PROVIDER: ${RAG_VECTOR_EMBEDDING_PROVIDER:-}
      RAG_VECTOR_EMBEDDING_MODEL_ID: ${RAG_VECTOR_EMBEDDING_MODEL_ID:-}
      RAG_VECTOR_EMBEDDING_MODEL_REVISION: ${RAG_VECTOR_EMBEDDING_MODEL_REVISION:-}
      RAG_VECTOR_EMBEDDING_DIMENSIONS: ${RAG_VECTOR_EMBEDDING_DIMENSIONS:-}
      RAG_VECTOR_EMBEDDING_INPUT_LIMIT: ${RAG_VECTOR_EMBEDDING_INPUT_LIMIT:-}
      RAG_VECTOR_EMBEDDING_DISTANCE: ${RAG_VECTOR_EMBEDDING_DISTANCE:-}
      RAG_VECTOR_EMBEDDING_NORMALIZATION: ${RAG_VECTOR_EMBEDDING_NORMALIZATION:-}
      RAG_VECTOR_EMBEDDING_CONFIG_HASH: ${RAG_VECTOR_EMBEDDING_CONFIG_HASH:-}
      RAG_ANSWER_PROVIDER: ${RAG_ANSWER_PROVIDER:-}
      RAG_ANSWER_MODEL_ID: ${RAG_ANSWER_MODEL_ID:-}
      RAG_ANSWER_MODEL_REVISION: ${RAG_ANSWER_MODEL_REVISION:-}
      RAG_ANSWER_CONTEXT_LIMIT: ${RAG_ANSWER_CONTEXT_LIMIT:-}
      RAG_ANSWER_MAX_OUTPUT_BYTES: ${RAG_ANSWER_MAX_OUTPUT_BYTES:-}
      RAG_ANSWER_MAX_EVIDENCE: ${RAG_ANSWER_MAX_EVIDENCE:-}
      RAG_ANSWER_DIMENSIONS: ${RAG_ANSWER_DIMENSIONS:-}
      RAG_ANSWER_INPUT_LIMIT: ${RAG_ANSWER_INPUT_LIMIT:-}
      RAG_ANSWER_CONFIG_HASH: ${RAG_ANSWER_CONFIG_HASH:-}
      RAG_RERANKER_ENABLED: ${RAG_RERANKER_ENABLED:-false}
      RAG_RERANKER_PROVIDER: ${RAG_RERANKER_PROVIDER:-}
      RAG_RERANKER_MODEL_ID: ${RAG_RERANKER_MODEL_ID:-}
      RAG_RERANKER_MODEL_REVISION: ${RAG_RERANKER_MODEL_REVISION:-}
      RAG_RERANKER_DIMENSIONS: ${RAG_RERANKER_DIMENSIONS:-}
      RAG_RERANKER_INPUT_LIMIT: ${RAG_RERANKER_INPUT_LIMIT:-}
      RAG_RERANKER_CONFIG_HASH: ${RAG_RERANKER_CONFIG_HASH:-}
      HTTP_PROXY: ${HTTP_PROXY:-http://clash:7890}
      HTTPS_PROXY: ${HTTPS_PROXY:-http://clash:7890}
      ALL_PROXY: ${ALL_PROXY:-socks5://clash:7891}
      NO_PROXY: ${NO_PROXY:-localhost,127.0.0.1,stage6-backend,stage6-redis,stage6-qdrant,backend,qdrant}
    depends_on:
      stage6-redis:
        condition: service_healthy
    networks:
      stage6-network:
        aliases:
          - backend
      pr-network: {}
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>r.json()).then(h=>{if(h?.services?.database!=='ok')process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  stage6-redis:
    image: redis:7-alpine
    container_name: pr-manager-stage6-redis
    restart: unless-stopped
    volumes:
      - ${DATA_ROOT:?DATA_ROOT is required}/redis:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
    networks:
      - stage6-network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20

  stage6-qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    container_name: pr-manager-stage6-qdrant
    restart: "no"
    ports:
      - "127.0.0.1:${QDRANT_PORT:-16333}:6333"
    volumes:
      - ${RAG_VECTOR_DATA_ROOT:?RAG_VECTOR_DATA_ROOT is required}/storage:/qdrant/storage
      - ${RAG_VECTOR_DATA_ROOT:?RAG_VECTOR_DATA_ROOT is required}/snapshots:/qdrant/snapshots
    networks:
      stage6-network:
        aliases:
          - qdrant
    healthcheck:
      test:
        - CMD-SHELL
        - "grep -q ':18BD ' /proc/net/tcp || exit 1"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  stage6-frontend:
    image: ghcr.io/hefei21/personal-resource-manager-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: pr-manager-stage6-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:?FRONTEND_PORT is required}:80"
    depends_on:
      stage6-backend:
        condition: service_healthy
    networks:
      - stage6-network
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1/ || exit 1"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  stage6-network:
    name: pr-manager-stage6-network
    driver: bridge
  pr-network:
    external: true
    name: ${PROXY_NETWORK_NAME:?PROXY_NETWORK_NAME is required}
