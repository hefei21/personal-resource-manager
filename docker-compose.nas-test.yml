services:
  backend:
    image: ghcr.io/hefei21/personal-resource-manager-backend:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: pr-test-backend
    restart: unless-stopped
    ports:
      - "13000:3000"
    volumes:
      - ${TEST_DATA_ROOT:?TEST_DATA_ROOT is required}/db:/app/data/database
      - ${TEST_DATA_ROOT:?TEST_DATA_ROOT is required}/documents:/app/data/documents
      - ${TEST_DATA_ROOT:?TEST_DATA_ROOT is required}/storage:/app/data/storage
      - ${TEST_DATA_ROOT:?TEST_DATA_ROOT is required}/music:/app/data/music
      - ${TEST_DATA_ROOT:?TEST_DATA_ROOT is required}/books:/app/data/books
      - ${TEST_DATA_ROOT:?TEST_DATA_ROOT is required}/code:/app/data/code
      - ${TEST_DATA_ROOT:?TEST_DATA_ROOT is required}/uploads:/app/data/uploads
      - ${TEST_DATA_ROOT:?TEST_DATA_ROOT is required}/logs:/app/data/logs
    environment:
      NODE_ENV: production
      PORT: 3000
      DATA_PATH: /app/data
      DB_PATH: /app/data/database/app.db
      DOCUMENTS_PATH: /app/data/documents
      STORAGE_PATH: /app/data/storage
      MUSIC_PATH: /app/data/music
      BOOKS_PATH: /app/data/books
      CODE_PATH: /app/data/code
      UPLOADS_PATH: /app/data/uploads
      LOGS_PATH: /app/data/logs
      DEFAULT_USERNAME: ${TEST_ADMIN_USERNAME:?TEST_ADMIN_USERNAME is required}
      DEFAULT_PASSWORD: ${TEST_ADMIN_PASSWORD:?TEST_ADMIN_PASSWORD is required}
      # HTTPS 内网穿透在容器外终止 TLS，必须显式信任浏览器看到的精确 Origin。
      CORS_ORIGIN: ${TEST_PUBLIC_ORIGIN:-}
      REDIS_URL: redis://redis:6379
      RAG_VECTOR_ENABLED: ${RAG_VECTOR_ENABLED:-false}
      RAG_VECTOR_BASE_URL: ${RAG_VECTOR_BASE_URL:-http://qdrant:6333}
      RAG_VECTOR_COLLECTION: ${RAG_VECTOR_COLLECTION:-rag_vectors_test}
      RAG_VECTOR_TIMEOUT_MS: ${RAG_VECTOR_TIMEOUT_MS:-5000}
      RAG_VECTOR_EMBEDDING_PROVIDER: ${RAG_VECTOR_EMBEDDING_PROVIDER:-}
      RAG_VECTOR_EMBEDDING_MODEL_ID: ${RAG_VECTOR_EMBEDDING_MODEL_ID:-}
      RAG_VECTOR_EMBEDDING_MODEL_REVISION: ${RAG_VECTOR_EMBEDDING_MODEL_REVISION:-}
      RAG_VECTOR_EMBEDDING_DIMENSIONS: ${RAG_VECTOR_EMBEDDING_DIMENSIONS:-}
      RAG_VECTOR_EMBEDDING_INPUT_LIMIT: ${RAG_VECTOR_EMBEDDING_INPUT_LIMIT:-}
      RAG_VECTOR_EMBEDDING_DISTANCE: ${RAG_VECTOR_EMBEDDING_DISTANCE:-}
      RAG_VECTOR_EMBEDDING_NORMALIZATION: ${RAG_VECTOR_EMBEDDING_NORMALIZATION:-}
      RAG_VECTOR_EMBEDDING_CONFIG_HASH: ${RAG_VECTOR_EMBEDDING_CONFIG_HASH:-}
      RAG_RERANKER_ENABLED: ${RAG_RERANKER_ENABLED:-false}
      RAG_RERANKER_PROVIDER: ${RAG_RERANKER_PROVIDER:-}
      RAG_RERANKER_MODEL_ID: ${RAG_RERANKER_MODEL_ID:-}
      RAG_RERANKER_MODEL_REVISION: ${RAG_RERANKER_MODEL_REVISION:-}
      RAG_RERANKER_DIMENSIONS: ${RAG_RERANKER_DIMENSIONS:-}
      RAG_RERANKER_INPUT_LIMIT: ${RAG_RERANKER_INPUT_LIMIT:-}
      RAG_RERANKER_CONFIG_HASH: ${RAG_RERANKER_CONFIG_HASH:-}
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      ALL_PROXY: ""
      NO_PROXY: localhost,127.0.0.1,redis,backend,qdrant
      BANGUMI_ACCESS_TOKEN: ""
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - pr-test-network
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>r.json()).then(h=>{if(h?.services?.database!=='ok')process.exit(1)}).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: pr-test-redis
    restart: unless-stopped
    volumes:
      - ${TEST_DATA_ROOT:?TEST_DATA_ROOT is required}/redis:/data
    command:
      - redis-server
      - --appendonly
      - "yes"
    networks:
      - pr-test-network
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 3s
      retries: 20

  # Isolated vector index for the NAS acceptance stack. It is opt-in via the
  # rag-vector profile and never shares the production Qdrant data directory.
  qdrant:
    image: qdrant/qdrant:v1.19.0@sha256:057ee3a8da769fe7310dd3537b4dc7583bf87a95ce8ac43c0af5a46bc580d1fc
    profiles:
      - rag-vector
    restart: "no"
    ports:
      - "127.0.0.1:16333:6333"
    volumes:
      - ${TEST_RAG_VECTOR_DATA_ROOT:-${TEST_DATA_ROOT}/qdrant}/storage:/qdrant/storage
      - ${TEST_RAG_VECTOR_DATA_ROOT:-${TEST_DATA_ROOT}/qdrant}/snapshots:/qdrant/snapshots
    networks:
      - pr-test-network
    healthcheck:
      test:
        - CMD-SHELL
        - "grep -q ':18BD ' /proc/net/tcp || exit 1"
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  frontend:
    image: ghcr.io/hefei21/personal-resource-manager-frontend:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: pr-test-frontend
    restart: unless-stopped
    ports:
      - "15173:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pr-test-network

networks:
  pr-test-network:
    name: pr-test-network
    driver: bridge
